# TodoLight 앱 타깃 — `xcodegen generate`로 TodoLight.xcodeproj를 만든다.
# .xcodeproj는 git에 넣지 않는다(pbxproj는 리뷰도 병합도 안 된다). 설정은 전부 여기서 고친다.
name: TodoLight
options:
  bundleIdPrefix: com.neogul02
  deploymentTarget:
    iOS: "17.0"   # 상호작용 위젯(AppIntent)이 17부터 — docs/ios-m2-setup.md §1
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6"            # TodoLightKit이 엄격 동시성이라 경계 경고를 피한다
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""          # Xcode에서 Apple ID를 넣으면 그 팀으로 채운다
packages:
  TodoLightKit:
    path: ../TodoLightKit
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
targets:
  TodoLight:
    type: application
    platform: iOS
    sources:
      - path: TodoLight
        # 에디터 플러그인이 작업 폴더마다 만드는 상태 폴더 — 앱 번들에 섞이면 빌드가 깨진다
        excludes: ["**/.omc/**"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neogul02.todolight
        TARGETED_DEVICE_FAMILY: "1"          # iPhone 전용
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: todolight
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: TodoLightKit
      - package: Supabase
        product: Supabase
  TodoLightTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TodoLightTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: TodoLight
schemes:
  TodoLight:
    build:
      targets:
        TodoLight: all
    test:
      targets: [TodoLightTests]
