# TodoLight 앱 타깃 — `xcodegen generate`로 TodoLight.xcodeproj를 만든다.
# .xcodeproj는 git에 넣지 않는다(pbxproj는 리뷰도 병합도 안 된다). 설정은 전부 여기서 고친다.
name: TodoLight
options:
  bundleIdPrefix: com.neogul02
  deploymentTarget:
    iOS: "18.0"   # 꾹 눌러 끌기(UIGestureRecognizerRepresentable)·ControlWidget이 18부터
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6"            # TodoLightKit이 엄격 동시성이라 경계 경고를 피한다
    MARKETING_VERSION: "1.0.0"       # App Store에 보이는 버전. 빌드를 올릴 때마다 CURRENT_PROJECT_VERSION만 +1
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""          # Xcode에서 Apple ID를 넣으면 그 팀으로 채운다
packages:
  TodoLightKit:
    path: ../TodoLightKit
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
targets:
  TodoLight:
    type: application
    platform: iOS
    sources:
      - path: TodoLight
        # 에디터 플러그인이 작업 폴더마다 만드는 상태 폴더 — 앱 번들에 섞이면 빌드가 깨진다
        excludes: ["**/.omc/**"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neogul02.todolight
        TARGETED_DEVICE_FAMILY: "1"          # iPhone 전용
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: todolight
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    # todolight://add — 잠금화면 "할 일 추가" 버튼이 연다(GENERATE_INFOPLIST_FILE와 합쳐진다)
    info:
      path: TodoLight/Info.plist
      properties:
        # xcodegen은 이 둘을 1.0 / 1로 박아 넣는다 — 위 설정값을 따르게 한다(위젯과 같아야 심사를 통과한다)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # HTTPS(표준 암호화)만 쓴다 — 없으면 빌드를 올릴 때마다 수출 규정 질문이 뜬다
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.neogul02.todolight
            CFBundleURLSchemes: [todolight]
    # 위젯과 같이 쓰는 저장소 — 앱이 쓰고 위젯이 읽는다(WidgetSnapshot). 키체인 공유 그룹도 겸한다(SharedAuth)
    entitlements:
      path: TodoLight/TodoLight.entitlements
      properties:
        com.apple.security.application-groups: [group.com.neogul02.todolight]
    dependencies:
      - package: TodoLightKit
      - package: Supabase
        product: Supabase
      - target: TodoLightWidgets
  TodoLightWidgets:
    type: app-extension
    platform: iOS
    sources:
      - TodoLightWidgets
      # 앱과 같은 서버·같은 로그인 세션 — 두 타깃에 같이 컴파일한다
      - TodoLight/App/AppConfig.swift
      - TodoLight/Services/SharedAuth.swift
    info:
      path: TodoLightWidgets/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: todolight
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: TodoLightWidgets/TodoLightWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.neogul02.todolight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neogul02.todolight.widgets
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: TodoLightKit
      - package: Supabase
        product: Supabase
  TodoLightTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TodoLightTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: TodoLight
schemes:
  TodoLight:
    build:
      targets:
        TodoLight: all
    test:
      targets: [TodoLightTests]
